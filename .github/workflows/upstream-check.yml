name: Check upstream FastQC

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check for new upstream release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get pinned version
        id: pinned
        run: |
          version=$(grep '^version' UPSTREAM.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Get latest upstream release
        id: upstream
        run: |
          latest=$(gh api repos/s-andrews/FastQC/releases/latest --jq '.tag_name' | sed 's/^v//')
          echo "version=$latest" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create issue if new version available
        if: steps.pinned.outputs.version != steps.upstream.outputs.version
        run: |
          gh label create upstream-update --color 0E8A16 --description "New upstream FastQC release" --force
          existing=$(gh issue list --label "upstream-update" --state open --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            body=$(cat <<'EOF'
          Java FastQC **__UPSTREAM__** has been released.

          Current pinned version: **__PINNED__**

          ## Action needed

          1. Review [upstream changes](https://github.com/s-andrews/FastQC/releases/tag/v__UPSTREAM__)
          2. Update `UPSTREAM.toml` with new version and commit hash
          3. Update the `VERSION` and `VERSION_BANNER` constants in `src/lib.rs`
          4. Regenerate reference data from the release zip: `bash tests/equivalence/generate_reference.sh /path/to/unzipped/FastQC`
          5. Regenerate SVG patches: `uv run tests/equivalence/update_svg_patches.py`
          6. Run equivalence tests: `uv run tests/equivalence/compare.py --binary ./target/release/fastqc`
          EOF
            )
            body="${body//__UPSTREAM__/$UPSTREAM}"
            body="${body//__PINNED__/$PINNED}"
            gh issue create \
              --title "Upstream FastQC $UPSTREAM released" \
              --label "upstream-update" \
              --body "$body"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM: ${{ steps.upstream.outputs.version }}
          PINNED: ${{ steps.pinned.outputs.version }}
