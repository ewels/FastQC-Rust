[package]
name = "fastqc-rust"
version = "1.0.2-dev0"
authors = ["Phil Ewels <phil.ewels@seqera.io>"]
edition = "2021"
rust-version = "1.88.0"
description = "A Rust rewrite of FastQC - a quality control tool for high throughput sequence data"
license = "GPL-3.0-only"
repository = "https://github.com/ewels/FastQC-Rust"
homepage = "https://ewels.github.io/FastQC-Rust/"
readme = "README.md"
keywords = ["bioinformatics", "fastq", "quality-control", "sequencing"]
categories = ["science", "command-line-utilities"]
exclude = [
    "/docs",
    "/tests/equivalence",
    "/.github",
    "/Dockerfile",
    "/CLAUDE.md",
    "/UPSTREAM.toml",
    "/.gitattributes",
]

[[bin]]
name = "fastqc"
path = "src/main.rs"

[lib]
name = "fastqc_rust"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
# Parallel, multi-member gzip decompression for .fastq.gz (pure Rust, zlib-rs backend).
rapidgzip-core = "0.1.0"
bzip2-rs = "0.1"
noodles = { version = "0.88", features = ["bam", "sam", "bgzf"] }
# Only deflate: FastQC writes (and re-reads) nothing else, and the default
# feature set pulls in xz2 -> lzma-sys, which links system liblzma and needs a
# C toolchain -- the one thing standing between this crate and a genuinely
# pure-Rust, fully static build.
zip = { version = "2", default-features = false, features = ["deflate"] }
rayon = "1"
base64 = "0.22"
chrono = "0.4"
statrs = "0.17"
hdf5-pure = "0.1"
memchr = "2"
resvg = "0.47"
tiny-skia = "0.12"
png = "0.18"

# Terminal progress display.
indicatif = "0.18"
console = "0.16"

[target.'cfg(unix)'.dev-dependencies]
# Bindings only, no C compiled: used by the integration tests to open a pty, so
# the progress display can be exercised on the path real users take rather than
# only through FASTQC_PROGRESS=always.
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
