[package]
name = "fastqc-rust"
version = "1.0.2-dev0"
authors = ["Phil Ewels <phil.ewels@seqera.io>"]
edition = "2021"
rust-version = "1.88.0"
description = "A Rust rewrite of FastQC - a quality control tool for high throughput sequence data"
license = "GPL-3.0-only"
repository = "https://github.com/ewels/FastQC-Rust"
homepage = "https://ewels.github.io/FastQC-Rust/"
readme = "README.md"
keywords = ["bioinformatics", "fastq", "quality-control", "sequencing"]
categories = ["science", "command-line-utilities"]
exclude = [
    "/docs",
    "/tests/equivalence",
    "/.github",
    "/Dockerfile",
    "/CLAUDE.md",
    "/UPSTREAM.toml",
    "/.gitattributes",
]

[[bin]]
name = "fastqc"
path = "src/main.rs"

[lib]
name = "fastqc_rust"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
bzip2-rs = "0.1"
noodles = { version = "0.88", features = ["bam", "sam", "bgzf"] }
zip = "2"
rayon = "1"
base64 = "0.22"
chrono = "0.4"
statrs = "0.17"
hdf5-pure = "0.1"
memchr = "2"
resvg = "0.47"
tiny-skia = "0.12"
png = "0.18"

# Optional: parallel, multi-member gzip decompression (COMBINE-lab/rapidgzip-rust).
# Pure Rust (zlib-rs backend, no C toolchain). Not yet on crates.io, so pinned to a
# git revision. The `version` key lets fastqc-rust publish unchanged once
# rapidgzip-core 0.1.0 is released to crates.io (the git source is stripped on publish).
rapidgzip-core = { git = "https://github.com/COMBINE-lab/rapidgzip-rust", rev = "9b21b9d10afa69933c871342e0dfb1a8d0887a36", version = "0.1.0", optional = true }

[features]
default = ["native-zlib"]
native-zlib = ["flate2/zlib"]
# Enable the rapidgzip parallel-gzip backend for .fastq.gz inputs.
rapidgzip = ["dep:rapidgzip-core"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
